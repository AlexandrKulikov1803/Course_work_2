[project]
name = "course-work-2"
version = "0.1.0"
description = ""
authors = [
    { name = "Alexandr Kulikov", email = "kulic1803@yandex.ru" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.3.2,<3.0.0)",
    "pandas (>=2.3.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
flake8 = "^7.3.0"
isort = "^6.0.1"
mypy = "^1.17.1"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ".venv"

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass"
]